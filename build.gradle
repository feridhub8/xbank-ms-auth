plugins {
	id 'java'
	id 'org.springframework.boot' version '4.2.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.xbank.ms'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', '2026.0.0')
	set('testcontainersKeycloakVersion', '4.4.1')
	set('mapstructVersion', '1.6.3')
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.cloud:spring-cloud-starter-vault-config'
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-vault'
	testImplementation "com.github.dasniko:testcontainers-keycloak:${testcontainersKeycloakVersion}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

// Tests use the real Vault setup script and realm file from the sibling xbank-infrastructure repo.
// Override with -PinfrastructureDir=<path>.
def infrastructureDir = providers.gradleProperty('infrastructureDir')
		.orElse("${rootDir}/../xbank-infrastructure")

tasks.named('processTestResources') {
	from(infrastructureDir.map { "${it}/vault/setup" }) { into 'infrastructure/vault-setup' }
	from(infrastructureDir.map { "${it}/keycloak/realms" }) { into 'infrastructure/realms' }
}

tasks.named('test') {
	useJUnitPlatform()
	// LocalEnvFileIT runs the built jar as its own process.
	dependsOn tasks.named('bootJar')
}
