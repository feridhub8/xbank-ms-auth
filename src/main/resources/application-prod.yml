# Runs in Docker (docker-compose.yml) on xbank_network.
spring:
  config:
    import: vault://secret/xbank/prod/ms-auth
  cloud:
    vault:
      uri: ${VAULT_URL:http://vault:8200}

server:
  port: 8080

xbank:
  keycloak:
    url: ${KEYCLOAK_URL:http://keycloak:8080}
    realm: xbank

# API docs are for development only.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
